name: Check portfolio
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: npm run build
      - run: node scripts/fetch-webgl.mjs
      - run: python3 scripts/assemble-webgl.py
