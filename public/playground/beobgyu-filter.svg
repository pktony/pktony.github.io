<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Beobgyu Filter 손 제스처 인식 및 모자이크 시각화">
  <defs>
    <pattern id="grid-bg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2130" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-bg" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#08090c"/>
  <rect width="800" height="500" fill="url(#grid-bg)"/>
  <rect width="800" height="500" fill="url(#glow-bg)"/>

  <!-- Target mosaic zone highlight -->
  <g opacity="0.28">
    <rect x="368" y="96" width="64" height="144" rx="8" fill="#ff4d6a"/>
    <g fill="#ff4d6a" fill-opacity="0.45">
      <rect x="374" y="102" width="16" height="16"/><rect x="392" y="102" width="16" height="16"/><rect x="410" y="102" width="16" height="16"/>
      <rect x="374" y="120" width="16" height="16"/><rect x="392" y="120" width="16" height="16"/><rect x="410" y="120" width="16" height="16"/>
      <rect x="374" y="138" width="16" height="16"/><rect x="392" y="138" width="16" height="16"/><rect x="410" y="138" width="16" height="16"/>
      <rect x="374" y="156" width="16" height="16"/><rect x="392" y="156" width="16" height="16"/><rect x="410" y="156" width="16" height="16"/>
    </g>
  </g>

  <!-- Bounding box -->
  <rect x="278" y="88" width="244" height="328" rx="14" fill="none" stroke="#ffb84d" stroke-width="2" stroke-opacity="0.85"/>
  <rect x="278" y="64" width="128" height="24" rx="5" fill="#ffb84d"/>
  <text x="342" y="81" text-anchor="middle" fill="#08090c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">KNN MATCH · OK</text>

  <!-- 21-joint hand skeleton -->
  <g stroke="#ffb84d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Wrist to MCPs & palm -->
    <polyline points="400,382 346,342 316,304 300,264"/>
    <polyline points="400,382 362,256 350,196 344,154 340,124"/>
    <polyline points="400,382 400,248 400,180 400,136 400,104"/>
    <polyline points="400,382 438,258 446,204 450,164 452,134"/>
    <polyline points="400,382 470,278 482,232 488,198 492,172"/>
    <polyline points="362,256 400,248 438,258 470,278"/>
  </g>

  <!-- Joint dots -->
  <g fill="#08090c" stroke="#00e5ff" stroke-width="2">
    <circle cx="400" cy="382" r="5"/>
    <circle cx="346" cy="342" r="4"/><circle cx="316" cy="304" r="4"/><circle cx="300" cy="264" r="4"/>
    <circle cx="362" cy="256" r="4"/><circle cx="350" cy="196" r="4"/><circle cx="344" cy="154" r="4"/><circle cx="340" cy="124" r="4"/>
    <circle cx="400" cy="248" r="4"/><circle cx="400" cy="180" r="4"/><circle cx="400" cy="136" r="4"/><circle cx="400" cy="104" r="4"/>
    <circle cx="438" cy="258" r="4"/><circle cx="446" cy="204" r="4"/><circle cx="450" cy="164" r="4"/><circle cx="452" cy="134" r="4"/>
    <circle cx="470" cy="278" r="4"/><circle cx="482" cy="232" r="4"/><circle cx="488" cy="198" r="4"/><circle cx="492" cy="172" r="4"/>
  </g>

  <!-- Badges -->
  <rect x="32" y="30" width="166" height="32" rx="8" fill="#12141a" stroke="#ffb84d" stroke-opacity="0.55"/>
  <text x="115" y="51" text-anchor="middle" fill="#ffb84d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">KNN (k=3) · 10 CLASS</text>

  <rect x="614" y="30" width="154" height="32" rx="8" fill="#12141a" stroke="#ff4d6a" stroke-opacity="0.55"/>
  <text x="691" y="51" text-anchor="middle" fill="#ff4d6a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">AUTO MOSAIC</text>

  <text x="400" y="464" text-anchor="middle" fill="#8890a4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">21 HAND JOINTS  ·  15 ANGLE FEATURES  ·  WEBCAM / UPLOAD</text>
</svg>
